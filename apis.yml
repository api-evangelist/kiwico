aid: kiwico
name: KiwiCo
description: >-
  KiwiCo, Inc. is a direct-to-consumer education company headquartered in Mountain View,
  California, founded in 2011 by Sandra Oh Lin. KiwiCo designs and ships hands-on STEAM
  (science, technology, engineering, art and math) project kits — branded as crates — on a
  monthly subscription, with distinct lines aimed at every age from infants through teens
  and adults, alongside single-purchase kits sold through its online store. A KiwiCo
  Education division supplies the same project kits and NGSS-aligned lesson guides to
  schools, homeschools, after-school programs and camps. KiwiCo operates as a consumer
  e-commerce and subscription business and publishes no public developer program: there is
  no developer portal, API documentation, OpenAPI definition, SDK, CLI or webhook surface,
  and no /.well-known/ discovery documents on any of its hosts. This profile therefore
  captures verified company identity and public web properties only.
